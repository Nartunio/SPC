<!doctype html>
<html lang="pl">
  <head><meta charset="utf-8"><title>Auth0</title></head>
  <body>
    <h1>Przykładowe Auth0</h1>

    {% if user %}
      <p>Zalogowany jako: {{ user.name }} ({{ user.email }})</p>
      <p><a href="{% url 'profile' %}">Profil (ID Token)</a></p>
      <p><a href="{% url 'logout' %}">Wyloguj</a></p>
    {% else %}
      <a href="{% url 'login' %}">Zaloguj się przez Auth0</a>
    {% endif %}
  </body>
</html>
